<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Landing Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header id="header">
    <img 
      id="header-img" 
      src="https://w7.pngwing.com/pngs/171/283/png-transparent-paper-box-computer-icons-symbol-random-buttons-miscellaneous-angle-text.png" 
      alt="Product Logo"
    >

    <nav id="nav-bar">
      <a class="nav-link" href="#features">Features</a>
      <a class="nav-link" href="#video-section">Video</a>
      <a class="nav-link" href="#contact">Contact</a>
    </nav>
  </header>

  <!-- FEATURES SECTION -->
  <section id="features">
    <h2>Features</h2>
    <p>Our product is fast, reliable, and easy to use.</p>
  </section>

  <!-- VIDEO SECTION -->
  <section id="video-section">
    <h2>Watch How It Works</h2>
    <iframe 
      id="video"
      width="560"
      height="315"
      src="https://www.youtube.com/embed/jNQXAC9IVRw?si=QXcX3UVQUJFHVchv"
      allowfullscreen>
    </iframe>
  </section>

  <!-- CONTACT / FORM -->
  <section id="contact">
    <h2>Stay Updated</h2>
    <form 
      id="form"
      action="https://www.freecodecamp.org/email-submit"
    >
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Enter your email address"
        required
      >
      <input
        id="submit"
        type="submit"
        value="Get Started"
      >
    </form>
  </section>

</body>
</html>
